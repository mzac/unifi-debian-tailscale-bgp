# /etc/systemd/system/conntrackd.service.d/override.conf
# conntrackd binds its sync address on ens19. Without this, it can start before ifupdown has set that address
# ("can't open channel socket: Cannot assign requested address"), burn its restarts in one second and stay failed.
# Starting it before keepalived also means keepalived's notify script never has to launch a copy of its own.
[Unit]
Wants=network-online.target
After=network-online.target
Before=keepalived.service

[Service]
RestartSec=5
