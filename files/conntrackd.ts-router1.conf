# ts-router1 -- /etc/conntrackd/conntrackd.conf
# Syncs the connection/NAT table to the peer (FTFW over unicast UDP on the BGP transit VLAN), so after a failover
# the new VRRP master already has every SNAT mapping (tailnet 100.x -> 10.99.0.10:port) and sessions continue.
Sync {
    Mode FTFW {
        DisableExternalCache Off
        CommitTimeout 1800
        PurgeTimeout 5
    }
    UDP {
        IPv4_address 10.99.0.11
        IPv4_Destination_Address 10.99.0.12
        Port 3780
        Interface ens19
        SndSocketBuffer 1249280
        RcvSocketBuffer 1249280
        Checksum on
    }
}
General {
    Systemd on
    HashSize 32768
    HashLimit 131072
    LogFile on
    Syslog on
    LockFile /var/lock/conntrack.lock
    UNIX {
        Path /var/run/conntrackd.ctl
    }
    NetlinkBufferSize 2097152
    NetlinkBufferSizeMaxGrowth 8388608
    Filter From Userspace {
        Protocol Accept {
            TCP
            UDP
            ICMP
        }
        # The routers' own traffic (BGP, SSH to them, WireGuard, DNS) is not forwarded: don't sync it.
        # List 127.0.0.1, both inside addresses, THIS router's WAN (ens18) address and its own Tailscale IP.
        Address Ignore {
            IPv4_address 127.0.0.1
            IPv4_address 10.99.0.11
            IPv4_address 10.99.0.12
            # this router's ens18 (WAN, DHCP: reserve it)
            IPv4_address 10.98.0.11
            # this router's Tailscale IP (tailscale ip -4)
            IPv4_address 100.64.0.1
        }
    }
}
