frr version 10.3
frr defaults traditional
hostname ts-router2
log syslog informational
service integrated-vtysh-config
!
ip prefix-list lan seq 10 permit 10.0.0.0/8 ge 8
ip prefix-list tailscale seq 10 permit 100.64.0.0/10 ge 10
!
route-map tailscale permit 10
 match ip address prefix-list tailscale
exit
!
! ts-maint follow (ts-bgp-follow.service) rewrites this metric every second:
! 0 on the Tailscale primary, 200 on the standby. Start as standby.
route-map ts-med permit 10
 set metric 200
exit
!
ip route 100.64.0.0/10 Null0
!
router bgp 65001
 bgp router-id 10.99.0.12
 no bgp network import-check
 neighbor 10.99.0.1 remote-as 65000
 neighbor 10.99.0.1 update-source 10.99.0.12
 neighbor 10.99.0.1 timers 3 9
 !
 address-family ipv4 unicast
  redistribute static route-map tailscale
  no neighbor 10.99.0.1 send-community
  neighbor 10.99.0.1 soft-reconfiguration inbound
  neighbor 10.99.0.1 prefix-list lan in
  neighbor 10.99.0.1 prefix-list tailscale out
  neighbor 10.99.0.1 route-map ts-med out
 exit-address-family
exit
!
end
