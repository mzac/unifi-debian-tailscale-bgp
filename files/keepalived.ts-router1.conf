# ts-router1 -- /etc/keepalived/keepalived.conf
# VRRP VIP 10.99.0.10 = the shared SNAT address for tailnet -> LAN traffic. It FOLLOWS the Tailscale primary:
# both nodes have priority 100, the track script adds 50 on the primary, preempt is on (the default).
global_defs {
    router_id ts-router1
    script_user root
    enable_script_security
    vrrp_garp_master_refresh 60
}
vrrp_script ts_primary {
    script "/usr/local/sbin/ts-maint is-primary"
    interval 1
    timeout 5
    fall 1
    rise 1
    weight 50
}
vrrp_instance TS_VIP {
    state BACKUP
    interface ens19
    virtual_router_id 99
    priority 100
    advert_int 1
    unicast_src_ip 10.99.0.11
    unicast_peer {
        10.99.0.12
    }
    virtual_ipaddress {
        10.99.0.10/24 dev ens19 label ens19:vip
    }
    track_script {
        ts_primary
    }
    notify_master "/etc/conntrackd/primary-backup.sh primary"
    notify_backup "/etc/conntrackd/primary-backup.sh backup"
    notify_fault  "/etc/conntrackd/primary-backup.sh fault"
}
