<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'DejaVu Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Overview</text>
  <text x="450" y="66" text-anchor="middle" font-size="15" fill="#475569">Two identical routers. Whichever one Tailscale makes primary does all the work.</text>

  <!-- Tailnet -->
  <rect x="300" y="92" width="300" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">Tailnet</text>
  <text x="450" y="146" text-anchor="middle" font-size="14" fill="#5b21b6">your devices, anywhere</text>

  <!-- Router 1 (primary) -->
  <rect x="60" y="232" width="320" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="220" y="266" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">ts-router1</text>
  <rect x="155" y="280" width="130" height="28" rx="14" fill="#16a34a"/>
  <text x="220" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">PRIMARY</text>
  <text x="220" y="334" text-anchor="middle" font-size="15" fill="#14532d">BGP MED 0 · owns the VIP</text>
  <text x="220" y="358" text-anchor="middle" font-size="14" fill="#166534">10.99.0.11 + VIP 10.99.0.10</text>

  <!-- Router 2 (standby) -->
  <rect x="520" y="232" width="320" height="150" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="680" y="266" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">ts-router2</text>
  <rect x="615" y="280" width="130" height="28" rx="14" fill="#94a3b8"/>
  <text x="680" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">STANDBY</text>
  <text x="680" y="334" text-anchor="middle" font-size="15" fill="#334155">BGP MED 200 · NAT copy</text>
  <text x="680" y="358" text-anchor="middle" font-size="14" fill="#475569">10.99.0.12</text>

  <!-- tailnet <-> routers -->
  <line x1="370" y1="164" x2="270" y2="228" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="530" y1="164" x2="630" y2="228" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- sync -->
  <line x1="384" y1="306" x2="516" y2="306" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
  <text x="450" y="296" text-anchor="middle" font-size="13" fill="#92400e">NAT sync</text>
  <text x="450" y="326" text-anchor="middle" font-size="13" fill="#92400e">+ VRRP</text>

  <!-- Gateway -->
  <rect x="290" y="440" width="320" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="472" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">UniFi Gateway</text>
  <text x="450" y="498" text-anchor="middle" font-size="14" fill="#1d4ed8">picks the router with the lowest MED</text>

  <!-- BGP -->
  <line x1="230" y1="386" x2="360" y2="436" stroke="#2563eb" stroke-width="4" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="196" y="420" text-anchor="middle" font-size="14" fill="#1d4ed8">BGP (in use)</text>
  <line x1="670" y1="386" x2="540" y2="436" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="712" y="420" text-anchor="middle" font-size="14" fill="#1d4ed8">BGP (backup)</text>

  <!-- LAN -->
  <rect x="300" y="562" width="300" height="56" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="450" y="597" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">LAN · 10.0.0.0/8</text>
  <line x1="450" y1="518" x2="450" y2="558" stroke="#334155" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <line x1="40" y1="580" x2="80" y2="580" stroke="#334155" stroke-width="4"/><text x="90" y="585">in use</text>
    <line x1="40" y1="606" x2="80" y2="606" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/><text x="90" y="611">ready for failover</text>
  </g>
</svg>
